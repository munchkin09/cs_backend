# Docs for the Azure Container Registry: https://docs.microsoft.com/en-us/azure/container-registry/
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and push Docker image to Azure Container Registry

on:
  push:
    branches:
      - Generation_Controller
  workflow_dispatch:

env:
  REGISTRY: csanalyzer.azurecr.io
  IMAGE_NAME: cs-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_79C92A52B792451CA64F1DC893A9B496 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DDD4890F972A4138AFDFAA4AB99DD36B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_08D5E386C855403EA32C6590749D2443 }}

      - name: Login to Azure Container Registry
        run: az acr login --name csanalyzer

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            NODE_ENV=production

      - name: Display image details
        run: |
          echo "🐳 Docker image successfully built and pushed!"
          echo "📦 Registry: ${{ env.REGISTRY }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"
          echo ""
          echo "🚀 To deploy this image:"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"


          