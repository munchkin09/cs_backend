# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - cs-analyzer-back

on:
  push:
    branches:
      - Generation_Controller
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run test --if-present
          npm run build --if-present
          cp ./static/* ./backend/ # Copy static files to backend directory
          cd ./backend
          npm install --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_79C92A52B792451CA64F1DC893A9B496 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DDD4890F972A4138AFDFAA4AB99DD36B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_08D5E386C855403EA32C6590749D2443 }}

      - name: Create .env file
        run: |
          echo "LLM_API_KEY=${{secrets.LLM_API_KEY}}" >> .env
          echo "STEAM_API_KEY=${{secrets.STEAM_API_KEY}}" >> .env
          echo "SESSION_SECRET=${{secrets.SESSION_SECRET}}" >> .env
          echo "STEAM_RETURN_URL=${{secrets.STEAM_RETURN_URL}}" >> .env
          echo "DOMAIN=${{secrets.DOMAIN}}" >> .env
          echo "MONGODB_URI=${{secrets.MONGODB_URI}}" >> .env
          echo "AZURE_COSMOS_CONNECTIONSTRING=${{secrets.AZURE_COSMOS_CONNECTIONSTRING}}" >> .env
          echo "NODE_ENV=development" >> .env

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cs-analyzer-back'
          slot-name: 'Production'
          package: .


          