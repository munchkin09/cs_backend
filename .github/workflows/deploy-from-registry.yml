# Workflow para desplegar desde Azure Container Registry
name: Deploy from Container Registry

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag de la imagen a desplegar'
        required: true
        default: 'latest'
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  REGISTRY: csanalyzer.azurecr.io
  IMAGE_NAME: cs-backend
  RESOURCE_GROUP: cs_analyzer_dev

jobs:
  deploy-to-container-instance:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_79C92A52B792451CA64F1DC893A9B496 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DDD4890F972A4138AFDFAA4AB99DD36B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_08D5E386C855403EA32C6590749D2443 }}

      - name: Deploy to Azure Container Instances
        run: |
          # Eliminar instancia anterior si existe
          az container delete \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name cs-backend-${{ github.event.inputs.environment }} \
            --yes || true

          # Crear nueva instancia
          az container create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name cs-backend-${{ github.event.inputs.environment }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }} \
            --registry-login-server ${{ env.REGISTRY }} \
            --registry-username csanalyzer \
            --registry-password $(az acr credential show --name csanalyzer --query "passwords[0].value" -o tsv) \
            --dns-name-label cs-backend-${{ github.event.inputs.environment }} \
            --ports 3000 \
            --cpu 1 \
            --memory 2 \
            --environment-variables \
              NODE_ENV=production \
              PORT=3000 \
              LLM_PROVIDER=gemini \
            --secure-environment-variables \
              LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
              STEAM_API_KEY=${{ secrets.STEAM_API_KEY }} \
              SESSION_SECRET=${{ secrets.SESSION_SECRET }} \
              STEAM_RETURN_URL=${{ secrets.STEAM_RETURN_URL }} \
              DOMAIN=${{ secrets.DOMAIN }} \
              MONGODB_URI=${{ secrets.MONGODB_URI }} \
              AZURE_COSMOS_CONNECTIONSTRING=${{ secrets.AZURE_COSMOS_CONNECTIONSTRING }}

      - name: Get deployment info
        run: |
          echo "🚀 Deployment completed!"
          echo "📍 Container Instance: cs-backend-${{ github.event.inputs.environment }}"
          echo "🌐 URL: http://cs-backend-${{ github.event.inputs.environment }}.swedencentral.azurecontainer.io:3000"
          echo "🏷️  Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}"
          
          # Mostrar estado del contenedor
          az container show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name cs-backend-${{ github.event.inputs.environment }} \
            --query "{State:instanceView.state,IP:ipAddress.ip,FQDN:ipAddress.fqdn,Image:containers[0].image}" \
            --output table
