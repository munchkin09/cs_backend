name: 🚀 Deploy to Azure App Service
on:
  push:
    branches:
      - Generation_Controller
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🧑‍💻 Checkout code
        uses: actions/checkout@v3
      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      - name: 🛠️ Install dependencies
        run: npm install
      - name: 🦾 Install Azure Developer CLI
        run: |
          curl -fsSL https://aka.ms/install-azd.sh | bash
      - name: 🔑 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: 🔑 Azure Developer CLI Auth
        run: azd auth login --client-id ${{ secrets.AZURE_CLIENT_ID }} --client-secret ${{ secrets.AZURE_CLIENT_SECRET }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}
      - name: 🚀 Deploy with azd
        run: |
          azd provision --environment prod --preview
          azd up --environment prod
      - name: 📋 Show logs
        run: azd logs --environment prod
