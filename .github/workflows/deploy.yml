name: 🚀 Deploy to Azure Container Registry

on: 
  push:
    branches:
      - main
      - develop

    
env:
  REGISTRY_NAME: csanalyzercontainerregistry
  IMAGE_NAME: cs-backend
  IMAGE_TAG: latest

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

  build-and-deploy:
    name: 🐳 Build and Deploy to ACR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Azure CLI Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🏗️ Build and push Docker image to ACR
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STEAM_RETURN_URL: ${{ secrets.STEAM_RETURN_URL }}
          DOMAIN: ${{ secrets.DOMAIN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          az acr build \
            --registry ${{ env.REGISTRY_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --file Dockerfile_deploy \
            --build-arg LLM_API_KEY="${LLM_API_KEY}" \
            --build-arg STEAM_API_KEY="${STEAM_API_KEY}" \
            --build-arg SESSION_SECRET="${SESSION_SECRET}" \
            --build-arg STEAM_RETURN_URL="${STEAM_RETURN_URL}" \
            --build-arg DOMAIN="${DOMAIN}" \
            --build-arg MONGODB_URI="${MONGODB_URI}" \
            .

      - name: 👋 Logout from Azure
        run: az logout
        if: always()
