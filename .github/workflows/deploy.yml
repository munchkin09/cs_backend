name: 🚀 Deploy to Azure Container Registry

on: 
  push:
    branches:
      - main
      - develop

env:
  REGISTRY_NAME: csanalyzercontainerregistry
  IMAGE_NAME: cs-backend

jobs:
  build-and-deploy:
    name: 🐳 Build and Deploy to ACR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 📋 Verify Azure login
        run: az account show

      #- name: 🏗️ Build and push Docker image to ACR
        #run: |
          #az acr build . \
            #--registry ${{ env.REGISTRY_NAME }} \
            #--image ${{ env.IMAGE_NAME }}:latest \
            #--file Dockerfile_deploy \
            #--timeout 3600 \
            #--build-arg LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
            #--build-arg STEAM_API_KEY="${{ secrets.STEAM_API_KEY }}" \
            #--build-arg SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
            #--build-arg STEAM_RETURN_URL="${{ secrets.STEAM_RETURN_URL }}" \
            #--build-arg DOMAIN="${{ secrets.DOMAIN }}" \
            #--build-arg MONGODB_URI="${{ secrets.MONGODB_URI }}"
      
            # 4. Build the Docker image
      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile_deploy \
            --build-arg LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
            --build-arg STEAM_API_KEY="${{ secrets.STEAM_API_KEY }}" \
            --build-arg SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
            --build-arg STEAM_RETURN_URL="${{ secrets.STEAM_RETURN_URL }}" \
            --build-arg DOMAIN="${{ secrets.DOMAIN }}" \
            --build-arg MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            -t csanalyzercontainerregistry.azurecr.io/cs-backend:latest \
            .

      # 5. Push the image to ACR
      - name: Push Docker image
        run: |
          docker push csanalyzercontainerregistry.azurecr.io/cs-backend:latest
      - name: 🏷️ Verify image in ACR
        run: |
          az acr repository show --name ${{ env.REGISTRY_NAME }} --image ${{ env.IMAGE_NAME }}:latest

      - name: 👋 Logout from Azure
        run: az logout
        if: always()
  
  farewell:
    name: 👋 Farewell
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()

    steps:
      - name: 📝 Log farewell message
        run: echo "🤖 Deployment completed successfully. Goodbye! 🤖"