name: 🚀 Deploy to Azure Container Registry

on: 
  push:
    branches:
      - main
      - develop

env:
  REGISTRY_NAME: csanalyzercontainerregistry
  IMAGE_NAME: cs-backend

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
            ref: develop

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

  build-and-deploy:
    name: 🐳 Build and Deploy to ACR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
            ref: develop

      - name: 🔐 Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 📋 Verify Azure login
        run: az account show

      - name: 🏗️ Build and push Docker image to ACR
        run: |
          az acr build \
            --registry ${{ env.REGISTRY_NAME }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --file Dockerfile_deploy \
            --timeout 3600 \
            --build-arg LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
            --build-arg STEAM_API_KEY="${{ secrets.STEAM_API_KEY }}" \
            --build-arg SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
            --build-arg STEAM_RETURN_URL="${{ secrets.STEAM_RETURN_URL }}" \
            --build-arg DOMAIN="${{ secrets.DOMAIN }}" \
            --build-arg MONGODB_URI="${{ secrets.MONGODB_URI }}" .

      - name: 🏷️ Verify image in ACR
        run: |
          az acr repository show --name ${{ env.REGISTRY_NAME }} --image ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 👋 Logout from Azure
        run: az logout
        if: always()
